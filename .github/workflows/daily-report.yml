name: XCF Cost per Asset — Daily Report

on:
  workflow_dispatch:   # manual trigger only — hosted on xero.dev, not GitHub Pages

jobs:
  run-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run report
        env:
          TZ:                     Pacific/Auckland
          ASANA_TOKEN:            ${{ secrets.ASANA_TOKEN }}
          ASANA_WORKSPACE_GID:    ${{ secrets.ASANA_WORKSPACE_GID }}
          ASANA_TEAM_GID:         ${{ secrets.ASANA_TEAM_GID }}
          DEFAULT_MINUTE_RATE:    ${{ secrets.DEFAULT_MINUTE_RATE }}
          EXCLUDED_MEMBER_GIDS:   ${{ secrets.EXCLUDED_MEMBER_GIDS }}
          REPORTS_DIR:            /tmp/reports
        run: node src/index.js

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: xcf-cost-per-asset-report
          path: /tmp/reports/xcf-cost-per-asset-*.html
          retention-days: 7
